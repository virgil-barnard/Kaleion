[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleion"
version = "0.1.0"
description = "Discover mathematics through motion: a symbolic discovery core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
proof = [
    "z3-solver>=4.13,<5",
]
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbconvert>=7,<8",
    "plotly>=6,<7",
    "pillow>=10.4,<13",
    "imageio-ffmpeg>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
