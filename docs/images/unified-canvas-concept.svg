<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
<title id="title">Proposed Kaleion canvas: objects, construction, and captured replay</title>
<desc id="description">A concept drawing, not implemented UI. Two sources containing zero through three form sixteen pairs. A reusable sum lens highlights four pairs. Counts and ranks feed a stacked point arrangement. Its construction sheet explains the coordinate expressions and keyed rank read; the selected pair one, two has rank one. A separate named replay track samples the captured movement.</desc>
