name: Lean proof checks

on:
  pull_request:
    branches: [main]
    paths:
      - "proofs/lean/**"
      - "examples/statements/lean.py"
      - "tests/test_lean_requests.py"
      - ".github/workflows/lean-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: proofs/lean
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          leanchecker: "true"
          axiom-audit: "true"
          axiom-audit-root: "KaleionProofs"
          # Nano-Do 0.3.2 cannot parse Lean 4.28+ export streams yet:
          # https://github.com/leanprover/lean-action/issues/169
